<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Reset your password</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#52525b;">
                Click the button below to choose a new password. This link expires in {{expiryMinutes}} minutes.
              </p>
              <p style="margin:0 0 24px;text-align:center;">
                <a href="{{resetUrl}}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-size:15px;font-weight:600;">
                  Reset password
                </a>
              </p>
              <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#71717a;">
                Or copy and paste this link into your browser:
              </p>
              <p style="margin:0 0 24px;font-size:13px;line-height:1.5;word-break:break-all;color:#3f3f46;">
                {{resetUrl}}
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#71717a;">
                If you did not request a password reset, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
